<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // โค้ดของมึงที่กูประกอบร่างให้เสร็จแล้ว
  const firebaseConfig = {
    authDomain: "anonymous-2af70.firebaseapp.com",
    projectId: "anonymous-2af70",
    storageBucket: "anonymous-2af70.firebasestorage.app",
    messagingSenderId: "56629997561",
    appId: "1:56629997561:web:90d1bce34024fd782d728",
    measurementId: "G-K96C5CY8CC",
    databaseURL: "https://anonymous-2af70-default-rtdb.firebaseio.com",
    apiKey: "AIzaSyBZvq_HkJ_U7b-Iw" // กูเติมอันที่แหว่งไปคืนให้
  };

  // เริ่มต้นทำงานกับระบบฐานข้อมูล
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const viewCountEl = document.getElementById("view-count"); 
  const ipListEl = document.getElementById("ip-list");       

  // ดึง IP คนเข้าเว็บแล้วส่งไปเก็บที่ Firebase
  fetch('https://api.ipify.org?format=json')
    .then(response => response.json())
    .then(data => {
      const userIP = data.ip;
      const ipHistoryRef = ref(db, 'ip_history');
      push(ipHistoryRef, {
        ip: userIP,
        timestamp: new Date().toISOString()
      });
    })
    .catch(err => console.error("ดึง IP พัง: ", err));

  // สั่งนับยอดวิวบวกรวมเพิ่มขึ้นทีละ 1 ของทุกคน
  const totalViewsRef = ref(db, 'total_views');
  runTransaction(totalViewsRef, (currentValue) => {
    return (currentValue || 0) + 1;
  });

  // ดึงยอดวิวจาก Firebase มาโชว์บนหน้าจอแบบ Realtime
  onValue(totalViewsRef, (snapshot) => {
    const views = snapshot.val() || 0;
    if(viewCountEl) viewCountEl.innerText = views; 
  });

  // ดึงประวัติ IP ทั้งหมดมาพ่นออกหน้าจอ
  const ipHistoryRef = ref(db, 'ip_history');
  onValue(ipHistoryRef, (snapshot) => {
    if(ipListEl) {
      ipListEl.innerHTML = ""; 
      const data = snapshot.val();
      if(data) {
        Object.values(data).reverse().forEach(item => {
          const li = document.createElement("p"); 
          li.innerText = item.ip;
          li.style.color = "#00FF00"; // สีเขียวแบบหน้าเว็บเดิมมึง
          li.style.margin = "5px 0";
          ipListEl.appendChild(li);
        });
      }
    }
  });
</script>
