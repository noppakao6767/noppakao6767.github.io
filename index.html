<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พี่ดำสุดหล่อ - Dino Adventure</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* (เอา CSS เดิมของมึงวางไว้ตรงนี้ได้เลยสัส) */
        body { background-color: #020208; color: #00FF66; margin: 0; font-family: 'Courier New', monospace; }
        #space-canvas { position: fixed; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none; }
        .main-wrapper { position: relative; z-index: 10; padding-top: 100px; display: flex; flex-direction: column; align-items: center; }
        #gameCanvas { border: 2px solid #00FF66; background: #050505; cursor: pointer; }
        .page-content { display: none; }
        .active-page { display: block; }
    </style>
</head>
<body>

    <canvas id="space-canvas"></canvas>

    <nav class="navbar">...</nav>
    <div class="sidebar" id="sidebarMenu">...</div>

    <div class="main-wrapper">
        <div id="profilePage" class="page-content active-page">...</div>
        <div id="loginPage" class="page-content">...</div>
        
        <div id="gamePage" class="page-content">
            <h2>SPACE DINO GAME</h2>
            <canvas id="gameCanvas" width="400" height="180"></canvas>
            <div>SCORE: <span id="currentScore">0</span></div>
        </div>
    </div>

    <script>
        // --- ส่วนของระบบเว็บ (เอฟเฟกต์ดาว, Sidebar) เอาของเก่ามึงใส่ไว้ตรงนี้ ---

        // --- ระบบเกม Dino (ตัวใหม่ที่รวมรูปและเสียงจอย) ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        // รูปมึง
        const dinoImg = new Image(); dinoImg.src = '07621f8b5d3ee28f4ae269ca95f20c0e.jpg';
        const cactusImg = new Image(); cactusImg.src = 'images (21).jpeg';

        let isPlaying = false, score = 0;
        let dino = { x: 30, y: 120, w: 40, h: 40, vy: 0, gravity: 0.8, jump: -12, grounded: false };
        let obstacles = [], spawnTimer = 0, speed = 5;

        function playJumpSound() {
            const joySound = new Audio('joy.mp3'); // ชื่อไฟล์เสียงต้องเป็น joy.mp3 นะสัส!
            joySound.play().catch(e => console.log("รอจิ้มจอ"));
        }

        function initGame() {
            isPlaying = true; score = 0; obstacles = [];
            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            if(!isPlaying) return;
            ctx.fillStyle = "#050505"; ctx.fillRect(0,0, canvas.width, canvas.height);
            
            // ไดโนเสาร์
            dino.vy += dino.gravity; dino.y += dino.vy;
            if(dino.y > 120) { dino.y = 120; dino.vy = 0; dino.grounded = true; }
            ctx.drawImage(dinoImg, dino.x, dino.y, dino.w, dino.h);

            // กระบองเพชร
            spawnTimer++;
            if(spawnTimer > 60) { obstacles.push({x: 400, y: 120, w: 40, h: 50}); spawnTimer = 0; }
            
            for(let i=obstacles.length-1; i>=0; i--) {
                let o = obstacles[i]; o.x -= speed;
                ctx.drawImage(cactusImg, o.x, o.y, o.w, o.h);
                if(dino.x < o.x + o.w && dino.x + dino.w > o.x && dino.y < o.y + o.h && dino.y + dino.h > o.y) { isPlaying = false; alert("ตายห่า!"); location.reload(); }
                if(o.x < -50) { obstacles.splice(i,1); score++; document.getElementById("currentScore").innerText = score; }
            }
            requestAnimationFrame(gameLoop);
        }

        // เชื่อมปุ่มกระโดด
        canvas.onclick = () => { 
            if(dino.grounded) { dino.vy = dino.jump; dino.grounded = false; playJumpSound(); } 
        };
    </script>
</body>
</html>
