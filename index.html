<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>มายเนมอิท</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0b0b;
            color: #fff;
            overflow-x: hidden;
        }

        .hero {
            height: 100vh;
            background: url('IMG_20260419_061914_854.webp') center center/cover no-repeat;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .65);
            backdrop-filter: blur(2px);
        }

        .profile {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(20, 20, 20, .6);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, .15);
            width: 90%;
            max-width: 450px;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow:
                0 0 5px #00ff66,
                0 0 10px #00ff66,
                0 0 20px #00ff66;
        }

        #typing {
            font-size: 18px;
            color: #00ff66;
            min-height: 27px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .tag {
            color: #bdbdbd;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .btns a {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            transition: .3s;
        }

        .btns a:hover {
            background: #444;
        }

        section {
            max-width: 1000px;
            margin: auto;
            padding: 50px 20px;
        }

        .card {
            background: #171717;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #2b2b2b;
        }

        .card h2 {
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #888;
        }

        .views-counter {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="hero">
        <div class="profile">
            <img class="avatar" src="IMG_20260419_061914_854.webp" alt="Profile Picture">
            <h1>พี่ดำสุดหล่อ</h1>
            <div id="typing"></div>
            <p class="tag">ID: 6767</p>
            <div class="btns">
                <a href="https://www.facebook.com/share/1DitXDcF4S/" target="_blank">Facebook</a>
                <a href="https://www.instagram.com/noppakao_1122?igsh=OGtqbjZuY3RzenUw" target="_blank">Instagram</a>
            </div>
        </div>
    </div>

    <section>
        <div class="card">
            <h2>เกี่ยวกับผม</h2>
            <p>ผมชื่อเจสันปีนี้อายุ 12 โขบงับ อยู่ ป.2 ชอบภาษาเขมรเพราะมันเมียงปร่ะจริงๆ</p>
        </div>
        
        <div class="card">
            <h2>โปรไฟล์</h2>
            <p>ยินดีต้อนรับสู่เว็บไซต์ส่วนตัวของพี่ดำสุดหล่อ</p>
        </div>
        
        <div class="card">
            <h2>ข้อมูลติดต่อของพี่ดำ</h2>
            <p>Facebook และ Instagram อยู่ด้านบนของเว็บไซต์</p>
        </div>
    </section>

    <footer>
        <p>© My Name It</p>
        <p class="views-counter">👀 ผู้เข้าชม: <span id="views">6767</span></p>
    </footer>

    <script>
        const welcomeText = "ยินดีต้อนรับสู่เว็บไซต์ของพี่ดำสุดหล่อเท่";
        const hackerText = [
            "ACCESS GRANTED",
            "CONNECTING...",
            "LOADING DATA...",
            "SYSTEM ONLINE",
            "WELCOME USER"
        ];

        let i = 0;
        let hackerIndex = 0;
        const typingElement = document.getElementById("typing");

        // ฟังก์ชันพิมพ์ดีดข้อความต้อนรับตอนเริ่มเว็บ
        function typeWriter() {
            if (i < welcomeText.length) {
                typingElement.innerHTML += welcomeText.charAt(i);
                i++;
                setTimeout(typeWriter, 80);
            } else {
                // เมื่อพิมพ์ดีดเสร็จแล้ว 2 วินาที ค่อยเริ่มแสดงข้อความสไตล์แฮกเกอร์
                setTimeout(startHackerText, 2000);
            }
        }

        // ฟังก์ชันเริ่มรันข้อความแฮกเกอร์สลับไปมา
        function startHackerText() {
            setInterval(() => {
                typingElement.innerHTML = hackerText[hackerIndex];
                hackerIndex++;
                if (hackerIndex >= hackerText.length) {
                    hackerIndex = 0;
                }
            }, 2000);
        }

        // เริ่มทำงานเมื่อเปิดหน้าเว็บ
        window.onload = function() {
            typeWriter();
        };
    </script>
</body>
</html>
