<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการเข้าชม</title>
    <style>
        /* แต่งหน้าเว็บให้เป็นโทนสีดำ-เขียว แบบไซเบอร์ตามรูปของมึง */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #111111;
            border: 1px solid #222222;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 {
            color: #00FF66;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtitle {
            color: #00FF66;
            font-size: 16px;
            margin-bottom: 25px;
        }
        .view-section {
            background-color: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            border-left: 4px solid #00FF66;
        }
        .view-title {
            color: #888888;
            font-size: 14px;
            margin: 0 0 5px 0;
        }
        .view-number {
            color: #00FF66;
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }
        .ip-title {
            color: #888888;
            font-size: 14px;
            margin-bottom: 15px;
        }
        /* กล่องแสดงรายการ IP */
        #ip-list {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }
        #ip-list p {
            color: #00FF66;
            font-family: monospace;
            font-size: 15px;
            background-color: #161616;
            padding: 12px;
            margin: 0 0 10px 0;
            border-radius: 8px;
            border: 1px solid #222222;
            word-break: break-all;
        }
        /* แต่ง Scrollbar ให้สวยเข้ากับธีม */
        #ip-list::-webkit-scrollbar {
            width: 6px;
        }
        #ip-list::-webkit-scrollbar-track {
            background: #111111;
        }
        #ip-list::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🕵️ ประวัติการเข้าชม</h2>
        <div class="subtitle">ล่าสุด (แชร์ข้อมูลร่วมกันของทุกคน)</div>
        
        <div class="view-section">
            <p class="view-title">ยอดการดูเว็บทั้งหมด</p>
            <p class="view-number"><span id="view-count">กำลังโหลด...</span> ครั้ง</p>
        </div>

        <div class="ip-title">เลข IP ผู้เข้าชมทั้งหมด</div>
        <div id="ip-list">
            <p>กำลังดึงข้อมูลประวัติ IP...</p>
        </div>
    </div>
