<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>มายเนมอิท</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050508;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* ฉากอวกาศ Canvas ขยับได้อยู่หลังสุด */
        #space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .hero {
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        /* กล่องโปรไฟล์แบบกระจกใส (Glassmorphism) มีมิติเรืองแสงเขียว */
        .profile {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(10, 15, 15, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 25px;
            border: 1px solid rgba(0, 255, 102, 0.25);
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 255, 102, 0.05);
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #00ff66;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #fff;
            text-shadow:
                0 0 5px #00ff66,
                0 0 15px #00ff66;
        }

        #typing {
            font-size: 18px;
            color: #00ff66;
            min-height: 27px;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
        }

        .tag {
            color: #bdbdbd;
            font-size: 16px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .btns a {
            display: inline-block;
            padding: 12px 24px;
            margin: 5px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: .3s;
            font-weight: bold;
        }

        /* ปุ่มเอฟเฟกต์โฮเวอร์เรืองแสง */
        .btns a:hover {
            background: #00ff66;
            color: #000;
            box-shadow: 0 0 15px #00ff66;
            border-color: #00ff66;
            transform: translateY(-2px);
        }

        section {
            max-width: 1000px;
            margin: auto;
            padding: 50px 20px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(23, 23, 27, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transition: 0.3s;
        }

        .card:hover {
            border-color: rgba(0, 255, 102, 0.4);
            transform: translateY(-3px);
        }

        .card h2 {
            margin-bottom: 15px;
            color: #00ff66;
            font-size: 24px;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #666;
            position: relative;
            z-index: 1;
        }

        .views-counter {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
        }
        
        #views {
            color: #00ff66;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <canvas id="space-bg"></canvas>

    <div class="hero">
        <div class="profile">
            <img class="avatar" src="IMG_20260419_061914_854.webp" alt="Profile Picture">
            <h1>พี่ดำสุดหล่อ</h1>
            
            <div id="typing"></div>
            
            <p class="tag">ID: 6767</p>
            <div class="btns">
                <a href="https://www.facebook.com/share/1DitXDcF4S/" target="_blank">Facebook</a>
                <a href="https://www.instagram.com/noppakao_1122?igsh=OGtqbjZuY3RzenUw" target="_blank">Instagram</a>
            </div>
        </div>
    </div>

    <section>
        <div class="card">
            <h2>เกี่ยวกับผม</h2>
            <p>ผมชื่อเจสันปีนี้อายุ 12 โขบงับ อยู่ ป.2 ชอบภาษาเขมรเพราะมันเมียงปร่ะจริงๆ</p>
        </div>
        
        <div class="card">
            <h2>โปรไฟล์</h2>
            <p>ยินดีต้อนรับสู่เว็บไซต์ส่วนตัวของพี่ดำสุดหล่อ</p>
        </div>
        
        <div class="card">
            <h2>ข้อมูลติดต่อของพี่ดำ</h2>
            <p>Facebook และ Instagram อยู่ด้านบนของเว็บไซต์</p>
        </div>
    </section>

    <footer>
        <p>© My Name It</p>
        <p class="views-counter">👀 ผู้เข้าชม: <span id="views">6767</span></p>
    </footer>
