<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พี่ดำสุดหล่อ - Space Mission Control</title>
    <link rel="icon" type="image/webp" href="IMG_20250815_141336_905.webp">
    <style>
        body { background-color: #020208; color: #00FF66; margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Courier New', Courier, monospace; }
        #gameCanvas { border: 2px solid #00FF66; background: #050505; cursor: pointer; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="180"></canvas>
    <div style="margin-top: 10px;">SCORE: <span id="currentScore">0</span></div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let isPlaying = true, score = 0, stage = 0;
        let dino = { x: 30, y: 125, w: 25, h: 35, vy: 0, gravity: 0.8, jump: -12, grounded: false };
        let obstacles = [], particles = [], spawnTimer = 0, speed = 5;

        // ฟังก์ชันเล่นเสียงจอย
        function playJumpSound() {
            const joySound = new Audio('joy.mp3'); 
            joySound.play();
        }

        function doJump() { 
            if(dino.grounded && isPlaying) { 
                dino.vy = dino.jump; 
                dino.grounded = false; 
                playJumpSound(); 
            } 
        }
        canvas.onclick = doJump;

        function updateEffects() {
            if (stage === 0 && Math.random() < 0.2) particles.push({ x: Math.random()*canvas.width, y: 180, vx: 0, vy: -Math.random()*3-1, life: 30, color: "#FF4500" });
            if (stage === 1 && Math.random() < 0.5) particles.push({ x: Math.random()*canvas.width, y: 0, vx: 1, vy: 5, life: 40, color: "#AAAAFF" });
            if (stage === 2 && Math.random() < 0.3) particles.push({ x: Math.random()*canvas.width, y: Math.random()*180, vx: 0, vy: 0, life: 60, color: "#FFFFFF" });
        }

        function gameLoop() {
            if(!isPlaying) return;
            if(score > 20) stage = 1;
            if(score > 50) stage = 2;
            speed = 5 + (score/10);

            ctx.fillStyle = (stage === 0) ? "#330000" : (stage === 1 ? "#001a33" : "#e6f7ff");
            ctx.fillRect(0,0,canvas.width,canvas.height);

            updateEffects();

            dino.vy += dino.gravity; dino.y += dino.vy;
            if(dino.y > 125) { dino.y = 125; dino.vy = 0; dino.grounded = true; }
            ctx.fillStyle = (stage === 0) ? "#FF4500" : (stage === 2 ? "#00AAFF" : "#00FF66");
            ctx.fillRect(dino.x, dino.y, dino.w, dino.h);

            spawnTimer++;
            if(spawnTimer > Math.max(30, 80-speed)) { obstacles.push({ x: canvas.width, y: 130, w: 20, h: 30 }); spawnTimer = 0; }
            
            for(let i=obstacles.length-1; i>=0; i--) {
                let o = obstacles[i]; o.x -= speed;
                ctx.fillStyle = "#FF3333"; ctx.fillRect(o.x, o.y, o.w, o.h);
                if(dino.x < o.x + o.w && dino.x + dino.w > o.x && dino.y < o.y + o.h && dino.y + dino.h > o.y) { isPlaying = false; alert("ตายห่า! คะแนน: " + score); location.reload(); }
                if(o.x + o.w < 0) { obstacles.splice(i, 1); score++; document.getElementById("currentScore").innerText = score; }
            }

            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life--;
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3);
                if(p.life <= 0) particles.splice(i, 1);
            });

            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
