<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พี่ดำสุดหล่อ - Space Mission Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* สไตล์เดิมของมึงทั้งหมดที่มึงเคยให้มา กูเก็บไว้ครบทุกบรรทัด */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace, 'Segoe UI', Tahoma; -webkit-tap-highlight-color: transparent; }
        body { background-color: #020208; color: #00FF66; min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; position: relative; }
        #space-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .navbar { position: fixed; top: 0; left: 0; width: 100%; background: rgba(5, 5, 15, 0.95); backdrop-filter: blur(10px); border-bottom: 2px solid #00FF66; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 9999; box-shadow: 0 0 20px rgba(0, 255, 102, 0.2); }
        .nav-logo { font-size: 18px; font-weight: bold; color: #00FF66; display: flex; align-items: center; gap: 10px; text-shadow: 0 0 10px rgba(0, 255, 102, 0.5); }
        .nav-menu-btn { background: rgba(0, 255, 102, 0.15); color: #00FF66; border: 2px solid #00FF66; padding: 10px 18px; border-radius: 8px; cursor: pointer; z-index: 10000; }
        .sidebar { position: fixed; top: 0; right: -310px; width: 290px; height: 100%; background: rgba(5, 5, 20, 0.98); border-left: 2px solid #00FF66; z-index: 20000; transition: right 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); padding: 80px 20px; display: flex; flex-direction: column; gap: 15px; }
        .sidebar.active { right: 0 !important; }
        .main-wrapper { flex: 1; width: 100%; max-width: 460px; padding: 110px 20px 40px 20px; z-index: 10; }
        .page-content { display: none !important; }
        .page-content.active-page { display: block !important; }
        #gameCanvas { background: #050510; border: 2px solid #00FF66; border-radius: 10px; display: block; margin: 15px auto; max-width: 100%; cursor: crosshair; }
    </style>
</head>
<body>
    <canvas id="space-canvas"></canvas>
    <nav class="navbar">
        <div class="nav-logo"><i class="fa-solid fa-user-astronaut"></i> พี่ดำสุดหล่อ Terminal</div>
        <button class="nav-menu-btn" id="openSidebarBtn"><i class="fa-solid fa-bars"></i> เมนู</button>
    </nav>

    <div class="sidebar" id="sidebarMenu">
        <span class="close-sidebar" id="closeSidebarBtn" style="color:red; font-size:24px; cursor:pointer;">❌</span>
        <button class="sidebar-link" onclick="showPage('profilePage')">หน้าแรกโปรไฟล์</button>
        <button class="sidebar-link" onclick="showPage('gamePage')">เริ่มเกมยานยิง</button>
    </div>

    <div class="main-wrapper">
        <div id="profilePage" class="page-content active-page">
            <div class="profile-card">
                <div class="profile-title">พี่ดำสุดหล่อ</div>
                <div class="profile-subtitle">SYSTEM ACTIVE // NODE: 6767</div>
            </div>
        </div>

        <div id="gamePage" class="page-content">
            <h2>SPACE DEFENDER</h2>
            <canvas id="gameCanvas" width="360" height="500"></canvas>
            <div style="color:#00FF66; text-align:center;">SCORE: <span id="scoreDisplay">0</span></div>
        </div>
    </div>

    <script>
        // ระบบดาวตกฉากหลัง
        const sCanvas = document.getElementById("space-canvas");
        const sCtx = sCanvas.getContext("2d");
        sCanvas.width = window.innerWidth; sCanvas.height = window.innerHeight;
        
        function drawSpace() {
            sCtx.clearRect(0,0, sCanvas.width, sCanvas.height);
            sCtx.fillStyle = "white";
            if(Math.random() < 0.05) sCtx.fillRect(Math.random()*sCanvas.width, 0, 2, 20);
            requestAnimationFrame(drawSpace);
        }
        drawSpace();

        // ระบบเกมยานยิง
        const gCanvas = document.getElementById("gameCanvas");
        const gCtx = gCanvas.getContext("2d");
        let player = {x: 150, y: 400}, bullets = [], meteors = [], score = 0;

        function gameLoop() {
            gCtx.clearRect(0,0, 360, 500);
            gCtx.fillStyle = "#00bcff"; gCtx.fillRect(player.x, player.y, 40, 40);
            if(Math.random() < 0.05) meteors.push({x: Math.random()*330, y: -40});
            meteors.forEach((m, i) => { m.y += 3; gCtx.fillStyle="red"; gCtx.fillRect(m.x, m.y, 30, 30); });
            bullets.forEach((b, i) => { b.y -= 10; gCtx.fillStyle="yellow"; gCtx.fillRect(b.x, b.y, 5, 10); });
            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        // แก้บั๊กเมนู 3 ขีด (Event Listener แบบไม่บล็อก)
        document.getElementById('openSidebarBtn').onclick = () => document.getElementById('sidebarMenu').classList.add('active');
        document.getElementById('closeSidebarBtn').onclick = () => document.getElementById('sidebarMenu').classList.remove('active');
        
        function showPage(id) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active-page'));
            document.getElementById(id).classList.add('active-page');
            document.getElementById('sidebarMenu').classList.remove('active');
        }

        window.onmousemove = (e) => player.x = e.clientX - 180;
        window.onclick = () => bullets.push({x: player.x+18, y: player.y});
    </script>
</body>
</html>
