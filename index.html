<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>มายเนมอิท</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050508;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* พื้นหลังอวกาศเต็มจอ */
        #space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .hero {
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        /* กล่องโปรไฟล์กระจกใสเรืองแสง */
        .profile {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(10, 15, 15, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 35px;
            border-radius: 25px;
            border: 2px solid #00ff66;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.2);
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #00ff66;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 10px #00ff66;
        }

        #typing {
            font-size: 18px;
            color: #00ff66;
            min-height: 27px;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
        }

        .tag {
            color: #bdbdbd;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .btns a {
            display: inline-block;
            padding: 12px 24px;
            margin: 5px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: .3s;
            font-weight: bold;
        }

        .btns a:hover {
            background: #00ff66;
            color: #000;
            box-shadow: 0 0 15px #00ff66;
            transform: translateY(-2px);
        }

        section {
            max-width: 1000px;
            margin: auto;
            padding: 50px 20px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(23, 23, 27, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card h2 {
            margin-bottom: 15px;
            color: #00ff66;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #666;
            position: relative;
            z-index: 1;
        }
        
        #views {
            color: #00ff66;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <canvas id="space-bg"></canvas>

    <div class="hero">
        <div class="profile">
            <img class="avatar" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400" alt="Profile Picture">
            <h1>พี่ดำสุดหล่อ</h1>
            
            <div id="typing"></div>
            
            <p class="tag">ID: 6767</p>
            <div class="btns">
                <a href="https://www.facebook.com/share/1DitXDcF4S/" target="_blank">Facebook</a>
                <a href="https://www.instagram.com/noppakao_1122?igsh=OGtqbjZuY3RzenUw" target="_blank">Instagram</a>
            </div>
        </div>
    </div>

    <section>
        <div class="card">
            <h2>เกี่ยวกับผม</h2>
            <p>ผมชื่อเจสันปีนี้อายุ 12 โขบงับ อยู่ ป.2 ชอบภาษาเขมรเพราะมันเมียงปร่ะจริงๆ</p>
        </div>
        <div class="card">
            <h2>โปรไฟล์</h2>
            <p>ยินดีต้อนรับสู่เว็บไซต์ส่วนตัวของพี่ดำสุดหล่อ</p>
        </div>
        <div class="card">
            <h2>ข้อมูลติดต่อของพี่ดำ</h2>
            <p>Facebook และ Instagram อยู่ด้านบนของเว็บไซต์</p>
        </div>
    </section>

    <footer>
        <p>© My Name It</p>
        <p>👀 ผู้เข้าชม: <span id="views">6767</span></p>
    </footer>

    <script>
        // ระบบคำนวณและสั่งดวงดาวให้ขยับ
        const canvas = document.getElementById('space-bg');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const numStars = 150;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.8,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() * 0.4) + 0.1,
                alpha: Math.random()
            });
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 10, canvas.width/2, canvas.height/2, canvas.width);
            gradient.addColorStop(0, '#0a0e17');
            gradient.addColorStop(1, '#020204');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numStars; i++) {
                let s = stars[i];
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                
                s.alpha += (Math.random() - 0.5) * 0.04;
                if(s.alpha < 0.1) s.alpha = 0.1;
                if(s.alpha > 1) s.alpha = 1;
                
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                if(i % 8 === 0) {
                    ctx.fillStyle = `rgba(0, 255, 102, ${s.alpha})`;
                }
                ctx.fill();

                s.x += s.vx;
                s.y += s.vy;

                if (s.x < 0) s.x = canvas.width;
                if (s.x > canvas.width) s.x = 0;
                if (s.y < 0) s.y = canvas.height;
                if (s.y > canvas.height) s.y = 0;
            }
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // ระบบอักษรพิมพ์ดีดและแฮกเกอร์
        const welcomeText = "ยินดีต้อนรับสู่เว็บไซต์ของพี่ดำสุดหล่อเท่";
        const hackerText = ["ACCESS GRANTED", "CONNECTING...", "LOADING DATA...", "SYSTEM ONLINE", "WELCOME USER"];
        let typingIndex = 0;
        let hackerIndex = 0;
        const typingElement = document.getElementById("typing");

        function typeWriter() {
            if (typingIndex < welcomeText.length) {
                typingElement.innerHTML += welcomeText.charAt(typingIndex);
                typingIndex++;
                setTimeout(typeWriter, 80);
            } else {
                setTimeout(startHackerText, 2000);
            }
        }

        function startHackerText() {
            setInterval(() => {
                typingElement.innerHTML = hackerText[hackerIndex];
                hackerIndex++;
                if (hackerIndex >= hackerText.length) {
                    hackerIndex = 0;
                }
            }, 2000);
        }

        window.onload = function() {
            typeWriter();
        };
    </script>
</body>
