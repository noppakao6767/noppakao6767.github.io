<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พี่ดำสุดหล่อ - Space Mission Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, 'Segoe UI', Tahoma;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #020208;
            color: #00FF66;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(5, 5, 15, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 2px solid #00FF66;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
        }

        .nav-logo {
            font-size: 18px;
            font-weight: bold;
            color: #00FF66;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        .nav-menu-btn {
            background: rgba(0, 255, 102, 0.15);
            color: #00FF66;
            border: 2px solid #00FF66;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
            position: relative;
            z-index: 10000;
        }
        .nav-menu-btn:hover { 
            background: #00FF66; 
            color: #000;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 19999;
            display: none;
        }

        .sidebar {
            position: fixed;
            top: 0; 
            right: -310px;
            width: 290px; 
            height: 100%;
            background: rgba(5, 5, 20, 0.98);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-left: 2px solid #00FF66;
            z-index: 20000;
            transition: right 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            padding: 80px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .sidebar.active { 
            right: 0 !important; 
        }
        
        .close-sidebar {
            position: absolute;
            top: 20px; left: 20px;
            color: #ff3333; font-size: 24px; cursor: pointer;
        }

        .sidebar-link {
            background: rgba(0, 255, 102, 0.05);
            color: #00FF66;
            border: 1px solid rgba(0, 255, 102, 0.4);
            padding: 14px 15px;
            border-radius: 8px;
            text-align: left;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-link:hover { background: rgba(0, 255, 102, 0.2); }

        .main-wrapper {
            flex: 1;
            width: 100%;
            max-width: 460px;
            padding: 110px 20px 40px 20px;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .page-content {
            display: none !important;
        }
        .page-content.active-page {
            display: block !important;
        }

        .profile-card {
            background: rgba(10, 10, 25, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid #00FF66;
            border-radius: 24px;
            padding: 45px 25px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.25);
        }

        .profile-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00FF66, #00bcff);
            margin: 0 auto 25px auto;
            border: 2px solid #00FF66;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.5);
        }

        .profile-title {
            font-size: 30px;
            font-weight: bold;
            color: #00FF66;
            margin-bottom: 8px;
        }

        .profile-subtitle {
            font-size: 14px;
            color: #88c999;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .page-container {
            background: rgba(5, 5, 20, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid #00FF66;
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 255, 102, 0.3);
        }

        .page-container h2 {
            color: #00FF66;
            font-size: 22px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .input-box input {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00FF66;
            border-radius: 10px;
            color: #00FF66;
            font-size: 16px;
        }

        .submit-btn {
            width: 100%;
            background: rgba(0, 255, 102, 0.15);
            color: #00FF66;
            border: 2px solid #00FF66;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .submit-btn:hover { background: #00FF66; color: #000; }

        .social-login-group {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px dashed rgba(0, 255, 102, 0.3);
            padding-top: 20px;
        }

        .btn-social {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
            border: none;
        }

        .btn-google { background-color: #ffffff; color: #000000; }
        .btn-facebook { background-color: #1877F2; color: #ffffff; }

        #gameCanvas {
            background: #050510;
            border-radius: 10px;
            display: block;
            margin: 15px auto;
            border-bottom: 3px solid #00FF66;
            max-width: 100%;
        }

        .footer-section {
            width: 100%;
            background: rgba(5, 5, 15, 0.95);
            border-top: 2px solid #00FF66;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
            margin-top: auto;
        }

        .footer-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
        }

        .footer-box h3 {
            color: #00FF66;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(0, 255, 102, 0.4);
            padding-bottom: 6px;
            display: inline-block;
        }

        .footer-links { list-style: none; }
        .footer-links li {
            margin-bottom: 10px;
            font-size: 14px;
            color: #88c999;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">
            <i class="fa-solid fa-user-astronaut"></i> พี่ดำสุดหล่อ Terminal
        </div>
        <button class="nav-menu-btn" id="openSidebarBtn">
            <i class="fa-solid fa-bars"></i> เมนู
        </button>
    </nav>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="sidebar" id="sidebarMenu">
        <span class="close-sidebar" id="closeSidebarBtn">❌</span>
        <button class="sidebar-link" id="menuHomeBtn"><i class="fa-solid fa-terminal"></i> หน้าแรกโปรไฟล์</button>
        <button class="sidebar-link" id="menuLoginBtn"><i class="fa-solid fa-key"></i> เข้าสู่ระบบเล่นเกม</button>
    </div>

    <div class="main-wrapper">
        <div id="profilePage" class="page-content active-page">
            <div class="profile-card">
                <div class="profile-avatar"></div>
                <div class="profile-title">พี่ดำสุดหล่อ</div>
                <div class="profile-subtitle">SYSTEM ACTIVE // NODE: 6767</div>
            </div>
        </div>
    </div>

</body>
</html>
